<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #222;
    font-family: Arial, Helvetica, sans-serif;
    color: #ddd;
}


/* ================================
   PLAYER
================================ */

.player {
    width: 430px;
    margin: 50px auto;
    background: #333;
    border: 1px solid #555;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.5);
}


/* ================================
   ÜST BAŞLIK
================================ */

.titlebar {
    height: 34px;
    background: #222;
    display: flex;
    align-items: center;
    padding: 0 10px;

    font-size: 13px;
    font-weight: bold;
}
#digitalClock {
    margin-left: 10px;
    font-size: 12px;
    font-weight: normal;
    color: #aaa;
}

#digitalDate {
    margin-left: 10px;
    font-size: 12px;
    font-weight: normal;
    color: #aaa;
}
#weather {
    margin-left: 10px;
    font-size: 12px;
    font-weight: normal;
    color: #aaa;
}
/* ================================
   DİL BUTONLARI
================================ */

.language-buttons {
    margin-left: auto;
    display: flex;
    gap: 3px;
}

.language-buttons button {
    background: #333;
    border: 1px solid #555;
    border-radius: 3px;
    color: #aaa;
    font-size: 10px;
    padding: 3px 5px;
    cursor: pointer;
}

.language-buttons button:hover {
    background: #444;
    color: #ddd;
}
/* ================================
   EKRAN
================================ */

.display {
    margin: 10px;
    height: 75px;

    background: #010101;
    border: 1px solid #555;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.song-name {
    width: 90%;

    text-align: center;

    font-size: 15px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    color: #2B7834;
}

.status {
    margin-top: 6px;

    font-size: 10px;

    color: #777;
}


/* ================================
   ZAMAN
================================ */

.time-row {
    display: flex;
    justify-content: space-between;

    padding: 0 12px;

    font-size: 10px;

    color: #888;
}


/* ================================
   İLERLEME ÇUBUĞU
================================ */

.progress {
    height: 8px;

    margin: 5px 12px 0;

    background: #111;

    border: 1px solid #555;

    border-radius: 4px;

    cursor: pointer;

    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;

    background: #aaa;
}


/* ================================
   ANA KONTROLLER
================================ */

.controls {
    height: 55px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;
}

.control {
    width: 42px;
    height: 30px;

    background: #4a4a4a;

    border: 1px solid #666;

    border-radius: 4px;

    color: #ddd;

    cursor: pointer;

    font-size: 14px;
}

.control:hover {
    background: #5a5a5a;
}

.control:active {
    background: #3d3d3d;
}


.play {
    width: 50px;

    font-size: 17px;
}


/* ================================
   SES
================================ */

.volume-area {
    display: flex;

    align-items: center;

    gap: 8px;

    padding: 0 14px 12px;
}

.volume-icon {
    font-size: 14px;
}

.volume {
    flex: 1;

    height: 4px;

    cursor: pointer;
}


/* ================================
   ALT BUTONLAR
================================ */

.bottom {
    display: flex;

    border-top: 1px solid #555;

    background: #222;
}

.bottom button {
    flex: 1;

    height: 34px;

    background: transparent;

    border: 0;

    border-right: 1px solid #555;

    color: #ccc;

    cursor: pointer;
}

.bottom button:last-child {
    border-right: 0;
}

.bottom button:hover {
    background: #444;
}


/* ================================
   URL ALANI
================================ */

.url-area {
    display: none;

    padding: 8px;

    background: #292929;

    border-top: 1px solid #555;
}

.url-row {
    display: flex;

    gap: 5px;
}

.url-input {
    flex: 1;

    min-width: 0;

    padding: 7px;

    background: #111;

    border: 1px solid #555;

    border-radius: 3px;

    color: #ddd;

    outline: none;
}

.url-button {
    width: 55px;

    background: #4a4a4a;

    border: 1px solid #666;

    border-radius: 3px;

    color: #ddd;

    cursor: pointer;
}


/* ================================
   MOBİL
================================ */

@media(max-width:460px) {

    .player {
        width: calc(100% - 20px);
        margin: 20px auto;
    }

}
/* ================================
   PLAYLIST
================================ */

.playlist {
    display: none;
 
    max-height: 220px;
    overflow-y: auto;

    background: #111;

    border-top: 1px solid #555;
}

.radio-list {
    display: none;

    max-height: 220px;
    overflow-y: auto;

    background: #111;

    border-top: 1px solid #555;
}

.radio-item {
    padding: 7px 10px;

    border-bottom: 1px solid #3d3d3d;

    color: #aaa;

    font-size: 12px;

    cursor: pointer;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.radio-item:hover {
    background: #3a3a3a;
    color: #ddd;
}

.radio-item.active {
    background: #444;
    color: #fff;
}

.playlist-item {
    padding: 7px 10px;

    border-bottom: 1px solid #3d3d3d;

    color: #aaa;

    font-size: 12px;

    cursor: pointer;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.playlist-item:hover {
    background: #3a3a3a;
    color: #ddd;
}

.playlist-item.active {
    background: #444;
    color: #fff;
}


/* ================================
   KÜTÜPHANE
================================ */
.library {
    display: none;
    max-height: 220px;
    overflow-y: auto;
    background: #111;
    border-top: 1px solid #555;
}

.library-item {
    padding: 8px 10px;
    border-bottom: 1px solid #3d3d3d;
    color: #aaa;
    font-size: 12px;
    cursor: pointer;
}

.library-item:hover {
    background: #3a3a3a;
    color: #ddd;
}

.library-title {
    padding: 8px 10px;
    background: #333;
    color: #ddd;
    font-size: 11px;
    font-weight: bold;
    border-bottom: 1px solid #555;
}

.library-back {
    float: right;
    background: none;
    border: 0;
    color: #aaa;
    cursor: pointer;
}

.library-empty {
    padding: 12px 10px;
    color: #777;
    font-size: 11px;
    text-align: center;
}

.library-add {
    margin: 8px 10px;
    width: calc(100% - 20px);
    height: 30px;
    background: #4a4a4a;
    border: 1px solid #666;
    border-radius: 3px;
    color: #ddd;
    cursor: pointer;
}

.library-add:hover {
    background: #5a5a5a;
}

/* ================================
   KARIŞIK ÇAL AKTİF
================================ */

.control.shuffle-active {
    background: #666;
    color: #fff;
    border-color: #888;
}

.control.repeat-active {
    background: #666;
    color: #fff;
    border-color: #888;
}


.world-radio-list {
    display: none;
    max-height: 300px;
    overflow-y: auto;
    background: #111;
    border-top: 1px solid #444;
}

.world-tools {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #222;
    padding: 8px;
    display: flex;
    gap: 6px;
}

.world-tools select,
.world-tools input {
    min-width: 0;
    padding: 7px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #333;
    color: #ddd;
}

.world-tools select {
    width: 42%;
}

.world-tools input {
    width: 58%;
}

.world-station {
    padding: 9px 10px;
    border-bottom: 1px solid #333;
    cursor: pointer;
    color: #ddd;
}

.world-station:hover {
    background: #333;
}

.world-station-name {
    font-weight: bold;
}

.world-station-info {
    font-size: 11px;
    color: #888;
    margin-top: 3px;
}

</style>

<div class="player">

            00:00
        </span>

    </div>



    <!-- İLERLEME -->

    <div
        class="progress"
        id="progress"
    >

        <div
            class="progress-fill"
            id="progressFill"
        ></div>

    </div>



    <!-- KONTROLLER -->

    <div class="controls">

    <button
        class="control"
        onclick="previousTrack()"
    >
        ◀◀
    </button>


    <button
        class="control play"
        id="playButton"
        onclick="togglePlay()"
    >
        ▶
    </button>


    <button
        class="control"
        onclick="nextTrack()"
    >
        ▶▶
    </button>


    <button
        class="control"
        id="shuffleButton"
        onclick="toggleShuffle()"
        title="Karışık çal"
    >
        ⤮
    </button>

<button
    class="control"
    id="repeatButton"
    onclick="toggleRepeat()"
    title="Tekrar çal"
>
    ⟳
</button>
<button class="control" onclick="toggleWorldRadios()" title="Dünya Radyoları">🌍</button>
</div>


    <!-- SES -->

    <div class="volume-area">

        <span
            class="volume-icon"
            id="volumeIcon"
        >
            🔊
        </span>


        <input
            class="volume"
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

    </div>



    <!-- ALT MENÜ -->

    <div class="bottom">
<button
    onclick="selectMP3()"
>
    📂 Ekle
</button>


<button
    onclick="togglePlaylist()"
>
    🎵 Müzikler
</button>


<button
    onclick="toggleLibrary()"
>
    📚 Kitaplık
</button>


<button
    onclick="toggleRadios()"
>
    📻 Radyo
</button>


<button
    onclick="toggleURL()"
>
    🌐 URL
</button>

    </div>

<div class="playlist" id="playlist"></div>
<div class="radio-list" id="radioList"></div>
<div class="world-radio-list" id="worldRadioList">

    <div class="world-tools">

        <select id="worldCountrySelect" onchange="loadWorldStations()">
            <option value="">🌍 Ülke seç</option>
        </select>

        <input
            type="text"
            id="worldSearchInput"
            placeholder="Radyo ara..."
            oninput="filterWorldStations()"
        >

    </div>

    <div id="worldStations"></div>

</div>
<div class="library" id="library"></div>

    <!-- URL -->

    <div
        class="url-area"
        id="urlArea"
    >

        <div class="url-row">
            <input
                class="url-input"
                id="radioNameInput"
                type="text"
                placeholder="Radyo adı"
            >

            <button
                class="url-button"
                onclick="updateCurrentRadio()"
            >
                Değiştir
            </button>
        </div>

        <div class="url-row" style="margin-top:5px;">
            <input
                class="url-input"
                id="urlInput"
                type="text"
                placeholder="Radyo URL'si"
            >

            <button
                class="url-button"
                onclick="addURL()"
            >
                URL Ekle
            </button>
        </div>

    </div>



</div>



<!--
    DOSYA SEÇİCİ

<input
    type="file"
    id="fileInput"
    accept="audio/*"

<script>


/* ========================================
   SES MOTORU

/* ========================================
   DİL
======================================== */

let currentLanguage =
    localStorage.getItem("enisLanguage") || "tr";


const audio = new Audio();
let globalHls = null;
function playRadioStream(url) {

    if (globalHls) {
        globalHls.detachMedia();
        globalHls.destroy();
        globalHls = null;
    }

    audio.pause();
    audio.removeAttribute("src");
    audio.load();

    if (url.toLowerCase().split("?")[0].endsWith(".m3u8")) {

        if (Hls.isSupported()) {

            globalHls = new Hls();

            globalHls.loadSource(url);

            globalHls.attachMedia(audio);

            globalHls.on(
                Hls.Events.MANIFEST_PARSED,
                function() {

                    audio.play().catch(function() {

                        setStatus("playHint");

                    });

                }
            );

        }

        else if (
            audio.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            audio.src = url;

            audio.play().catch(function() {

                setStatus("playHint");

            });

        }

    }

    else {

        audio.src = url;

        audio.play().catch(function() {

            setStatus("playHint");

        });

    }
}

/* ========================================

======================================== */


fileInput.addEventListener(
    "change",
    function() {

        const files =
            Array.from(this.files);

        if (!files.length) {
            return;
        }

        const audioFiles =
            files.filter(function(file) {
                return file.type.startsWith("audio/");
            });

        if (!audioFiles.length) {
            return;
        }

        /*
           Klasör adını bul.
           webkitRelativePath örneği:

           Metallica/Master Of Puppets.mp3

           Buradan Metallica'yı alıyoruz.
        */

        let folderName = "Müzikler";

        if (
            audioFiles[0].webkitRelativePath
        ) {

            const parts =
                audioFiles[0]
                    .webkitRelativePath
                    .split("/");

            if (parts.length > 1) {
                folderName = parts[0];
            }
        }

        /*
           Klasör daha önce yoksa
           Kütüphaneye ekle.
        */

        const exists =
            musicFolders.some(function(folder) {
                return folder.name === folderName;
            });

        if (!exists) {

            musicFolders.push({
                name: folderName
            });

            localStorage.setItem(
                "enisMusicFolders",
                JSON.stringify(musicFolders)
            );
        }

        /*
           Müzikleri geçici olarak yükle.
        */

        tracks =
            audioFiles.map(function(file) {

                return {
                    name: file.name,
                    url: URL.createObjectURL(file)
                };

            });

        currentTrack = 0;

        renderPlaylist();

        loadTrack();

        /*
           Kütüphaneyi güncelle.
        */

        renderLibraryHome();

        /*
           Dosya seçimini temizle.
           Böylece aynı klasörü tekrar seçmek
           mümkün olur.
        */

        this.value = "";

    }
);

/* ========================================

======================================== */

audio.addEventListener(
    "timeupdate",
    function() {

        if (
            !isFinite(audio.duration) ||
            audio.duration <= 0
        ) {

            return;

        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressFill.style.width =
            percent + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);



/* ========================================
   İLERLEME ÇUBUĞU
======================================== */

progress.addEventListener(
    "click",
    function(event) {

        if (
            !isFinite(audio.duration) ||
            audio.duration <= 0
        ) {

            return;

        }


        const rect =
            progress.getBoundingClientRect();


        const percent =
            (
                event.clientX -
                rect.left
            ) / rect.width;


        audio.currentTime =
            percent *
            audio.duration;

    }
);

function toggleShuffle() {

    shuffleMode = !shuffleMode;

    const shuffleButton =
        document.getElementById("shuffleButton");

    if (shuffleMode) {

        shuffleButton.classList.add(
            "shuffle-active"
        );

        createShuffleOrder();

        

    }

    else {

        shuffleButton.classList.remove(
            "shuffle-active"
        );

        shuffleOrder = [];
        shufflePosition = -1;

        
    }
}


/* ========================================
   KARIŞIK SIRA OLUŞTUR
======================================== */

function createShuffleOrder() {

    shuffleOrder =
        tracks.map(function(_, index) {
            return index;
        });


    /*
       Fisher-Yates karıştırma
    */

    for (
        let i = shuffleOrder.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            shuffleOrder[i],
            shuffleOrder[j]
        ] = [
            shuffleOrder[j],
            shuffleOrder[i]
        ];
    }


    /*
       Şu anda çalan şarkı
       ilk sıraya gelsin.
    */

    if (currentTrack >= 0) {

        shuffleOrder =
            shuffleOrder.filter(
                function(index) {
                    return index !== currentTrack;
                }
            );

        shuffleOrder.unshift(
            currentTrack
        );
    }


    shufflePosition = 0;
}
function previousTrack() {

    if (!tracks.length) {
        return;
    }


    currentTrack--;

    if (currentTrack < 0) {

        currentTrack =
            tracks.length - 1;

    }


    loadTrack();

}

   TEKRAR ÇAL
======================================== */

function toggleRepeat() {

    repeatMode = !repeatMode;

    const repeatButton =
        document.getElementById("repeatButton");

    if (repeatMode) {

        repeatButton.classList.add(
            "repeat-active"
        );

    }

    else {

        repeatButton.classList.remove(
            "repeat-active"
        );

    }
}

/* ========================================
   SONRAKİ

   Şimdilik test amaçlı.
======================================== */

function nextTrack() {

    if (!tracks.length) {
        return;
    }


    /* ================================
       KARIŞIK MOD
    ================================= */

    if (shuffleMode) {

        /*
           Karışık listenin sonuna geldik.
        */

        if (
            shufflePosition >=
            shuffleOrder.length - 1
        ) {

            /*
               🔁 AÇIKSA
               yeni bir karışık tur oluştur.
            */

            if (repeatMode) {

                createShuffleOrder();

                /*
                   İlk şarkıyı hemen çal.
                */

                shufflePosition = 0;

            }

            /*
               🔁 KAPALIYSA
               tamamen dur.
            */

            else {

                audio.pause();

                playButton.textContent =
                    "▶";

                setStatus("listEnd");

                return;

            }

        }

        else {

            shufflePosition++;

        }


        currentTrack =
            shuffleOrder[shufflePosition];

    }


    /* ================================
       NORMAL MOD
    ================================= */

    else {

        /*
           Sıradaki şarkıya geç.
        */

        currentTrack++;


        /*
           Listenin sonuna geldik.
        */

        if (
            currentTrack >=
            tracks.length
        ) {

            /*
               🔁 AÇIKSA
               listenin başına dön.
            */

            if (repeatMode) {

                currentTrack = 0;

            }

            /*
               🔁 KAPALIYSA
               dur.
            */

            else {

                audio.pause();

                currentTrack =
                    tracks.length - 1;

                playButton.textContent =
                    "▶";

                setStatus("listEnd");

                return;

            }

        }

    }


    loadTrack();
    renderPlaylist();

    audio.play()
        .catch(function() {

            setStatus("playHint");

        });

}

        deleteButton.style.fontSize = "16px";

        /*
           Kodun içindeki varsayılan radyolar
           silinemez.
        */

        if (isDefaultRadio(radio)) {
            deleteButton.style.display = "none";
        }

        deleteButton.addEventListener("click", function(event) {

            event.stopPropagation();

            if (!confirm("'" + radio.name + "' silinsin mi?")) {
                return;
            }

            /*
               Radyoyu listeden çıkar
            */

            radioListData.splice(index, 1);

            /*
               Favorilerde varsa oradan da çıkar
            */

            favoriteRadios =
                favoriteRadios.filter(function(url) {
                    return url !== radio.url;
                });


            /*
               Kaydet
            */

            localStorage.setItem(
                "enisRadioList",
                JSON.stringify(radioListData)
            );

            localStorage.setItem(
                "enisFavoriteRadios",
                JSON.stringify(favoriteRadios)
            );


            /*
               Eğer silinen radyo şu anda çalıyorsa
            */

            if (currentRadio === index) {

                audio.pause();

                currentRadio = -1;

                songName.textContent = "Hazır";
                setStatus("radioDeleted");
                playButton.textContent = "▶";
            }

            /*
               Silinen elemanın arkasında
               seçili radyo varsa index'i düzelt
            */

            else if (currentRadio > index) {
                currentRadio--;
            }


            /*
               Listeyi yeniden çiz
            */

            renderRadios();
        });


        /* ================================
           FAVORİ BUTONU
        ================================= */

        const favoriteButton = document.createElement("button");

        favoriteButton.textContent =
            favoriteRadios.includes(radio.url)
                ? "★"
                : "☆";

        if (favoriteRadios.includes(radio.url)) {
            favoriteButton.style.color = "gold";
        }

        favoriteButton.style.float = "right";
        favoriteButton.style.background = "none";
        favoriteButton.style.border = "none";
        favoriteButton.style.cursor = "pointer";
        favoriteButton.style.fontSize = "18px";

        favoriteButton.addEventListener("click", function(event) {

            event.stopPropagation();

            if (favoriteRadios.includes(radio.url)) {

                favoriteRadios =
                    favoriteRadios.filter(function(url) {
                        return url !== radio.url;
                    });

            } else {

                favoriteRadios.push(radio.url);
            }

            localStorage.setItem(
                "enisFavoriteRadios",
                JSON.stringify(favoriteRadios)
            );

            renderRadios();
        });


        /* ================================
           SATIRA EKLE
        ================================= */

        item.appendChild(name);
        item.appendChild(addButton);
        item.appendChild(deleteButton);
        item.appendChild(favoriteButton);


        /* ================================
           RADYO SEÇME
        ================================= */

        item.addEventListener("click", function() {

            currentRadio = index;

            playRadioStream(radio.url);

            songName.textContent = radio.name;

            setStatus("ready");

            progressFill.style.width = "0%";

            currentTime.textContent = "00:00";
            duration.textContent = "00:00";

            playButton.textContent = "▶";

            fillURLFields();

            renderRadios();

            audio.play().catch(function() {
                setStatus("playHint");
            });
        });


        radioList.appendChild(item);
    });
}

function renderLibraryHome() {

    const library =
        document.getElementById("library");

    libraryView = "home";

    library.innerHTML = "";


    const title =
        document.createElement("div");

    title.className =
        "library-title";

    title.textContent =
        LT("library");

    library.appendChild(title);


    addLibraryRow(
        LT("favoriteRadios"),
        function() {
            renderFavoritesLibrary();
        }
    );


    addLibraryRow(
        LT("radios"),
        function() {
            toggleRadios();
        }
    );


    /* ========================================
       İÇE / DIŞA AKTAR
    ======================================== */

    const importExportRow =
        document.createElement("div");

    importExportRow.style.display =
        "flex";

    importExportRow.style.gap =
        "8px";

    importExportRow.style.padding =
        "6px 10px";


    const importButton =
        document.createElement("button");

    importButton.textContent =
        LT("import");

    importButton.style.flex =
        "1";

    importButton.style.cursor =
        "pointer";


    importButton.onclick =
        function() {

            const input =
                document.createElement("input");

            input.type =
                "file";

            input.accept =
                ".json";


            input.onchange =
                function(event) {

                    const file =
                        event.target.files[0];

                    if (!file) {
                        return;
                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function(e) {

                            try {

                                const data =
                                    JSON.parse(
                                        e.target.result
                                    );


                                if (
                                    !Array.isArray(
                                        data.radioList
                                    ) ||
                                    !Array.isArray(
                                        data.favorites
                                    )
                                ) {

                                    alert(
                                        LT("importInvalid")
                                    );

                                    return;
                                }


                                if (
                                    !confirm(
                                        LT("importConfirm")
                                    )
                                ) {

                                    return;
                                }


                                radioListData =
                                    data.radioList;

                                favoriteRadios =
                                    data.favorites;


                                localStorage.setItem(
                                    "enisRadioList",
                                    JSON.stringify(
                                        radioListData
                                    )
                                );


                                localStorage.setItem(
                                    "enisFavoriteRadios",
                                    JSON.stringify(
                                        favoriteRadios
                                    )
                                );


                                renderLibraryHome();


                                alert(
                                    LT("importSuccess")
                                );

                            }


                            catch (error) {

                                alert(
                                    LT("importError")
                                );

                            }

                        };


                    reader.readAsText(file);

                };


            input.click();

        };


    const exportButton =
        document.createElement("button");


    exportButton.textContent =
        LT("export");

    exportButton.style.flex =
        "1";

    exportButton.style.cursor =
        "pointer";


    exportButton.onclick =
        function() {

            const data = {

                radioList:
                    radioListData,

                favorites:
                    favoriteRadios

            };


            const blob =
                new Blob(
                    [
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    ],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const a =
                document.createElement("a");

            a.href =
                url;

            a.download =
                "ENIS-PLAYER-RADYOLAR.json";


            document.body.appendChild(a);

            a.click();

            document.body.removeChild(a);


            URL.revokeObjectURL(url);


            statusBox.textContent =
                LT("exportSuccess");

        };


    importExportRow.appendChild(
        importButton
    );

    importExportRow.appendChild(
        exportButton
    );

    library.appendChild(
        importExportRow
    );


    /* ========================================
       MÜZİKLER
    ======================================== */

    addLibraryRow(
        LT("music"),
        function() {
            renderMusicFolders();
        }
    );


    /* ========================================
       PLAYLISTLER
    ======================================== */

    const ptitle =
        document.createElement("div");

    ptitle.className =
        "library-title";

    ptitle.textContent =
        LT("playlists");

    library.appendChild(
        ptitle
    );


    if (!libraryPlaylists.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "library-empty";

        empty.textContent =
            LT("noPlaylist");

        library.appendChild(
            empty
        );

    }


    else {

        libraryPlaylists.forEach(
            function(pl, index) {

                addLibraryRow(
                    "📂  " + pl.name,
                    function() {
                        renderCustomPlaylist(index);
                    }
                );

            }
        );

    }


    const add =
        document.createElement("button");

    add.className =
        "library-add";

    add.textContent =
        LT("newPlaylist");

    add.onclick =
        createLibraryPlaylist;

    library.appendChild(
        add

function createLibraryPlaylist() {

    const name =
        prompt(
            LT("playlistName")
        );


    if (
        !name ||
        !name.trim()
    ) {

        return;

    }


    libraryPlaylists.push({

        name:
            name.trim(),

        items: []

    });


    saveLibraryPlaylists();

    renderLibraryHome();

}


/* ========================================
   PLAYLIST'E EKLE
======================================== */

function addLibraryItem(
    name,
    url,
    type
) {

    if (!libraryPlaylists.length) {

        const create =
            confirm(
                LT("noPlaylistAsk")
            );


        if (!create) {
            return;
        }


        const playlistName =
            prompt(
                LT("playlistName")
            );


        if (
            !playlistName ||
            !playlistName.trim()
        ) {

            return;

        }


        libraryPlaylists.push({

            name:
                playlistName.trim(),

            items: []

        });

    }


    let choices =
        libraryPlaylists
            .map(
                function(pl, i) {

                    return (
                        (i + 1) +
                        ". " +
                        pl.name
                    );

                }
            )
            .join("\n");


    const answer =
        prompt(
            LT("choosePlaylist") +
            "\n\n" +
            choices +
            "\n\n" +
            LT("enterNumber")
        );


    const index =
        Number(answer) - 1;


    if (
        !Number.isInteger(index) ||
        index < 0 ||
        index >= libraryPlaylists.length
    ) {

        return;

    }


    const exists =
        libraryPlaylists[index]
            .items
            .some(
                function(item) {

                    return (
                        item.type === type &&
                        item.url === url
                    );

                }
            );


    if (!exists) {

        libraryPlaylists[index]
            .items
            .push({

                name:
                    name,

                url:
                    url,

                type:
                    type

            });


        saveLibraryPlaylists();

    }


    statusBox.textContent =
        LT("playlistAdded");

}

function renderFavoritesLibrary() {

    const library =
        document.getElementById("library");

    libraryView =
        "favorites";

    library.innerHTML = "";


    const title =
        document.createElement("div");

    title.className =
        "library-title";

    title.textContent =
        LT("favorites");

    library.appendChild(
        title
    );


    let found = 0;

    ======================================== */

    favoriteRadios.forEach(
        function(url) {

            const radio =
                radioListData.find(
                    function(r) {

                        return r.url === url;

                    }
                );


            if (!radio) {
                return;
            }


            found++;


            const row =
                document.createElement("div");

            row.className =
                "library-item";

            row.textContent =
                "★  " +
                radio.name;


            row.onclick =
                function() {

                        );


                    currentRadio =
                        radioIndex;


                    playRadioStream(
                        radio.url
                    );


                    songName.textContent =
                        radio.name;


                    setStatus("ready");


                    playButton.textContent =
                        "▶";


                    renderRadios();

                };


            library.appendChild(
                row
            );

        }
    );


    /* ========================================
       DÜNYA RADYOLARI
    ======================================== */

    worldFavoriteRadios.forEach(
        function(radio) {

            if (
                !radio ||
                !radio.url
            ) {

                return;

            }


            found++;


            const row =
                document.createElement("div");

            row.className =
                "library-item";

            row.textContent =
                "🌍  " +
                (
                    radio.name ||
                    LT("worldRadio")
                );


            row.onclick =
                function() {

                    playRadioStream(
                        radio.url
                    );


                    songName.textContent =

function formatTime(seconds) {

    if (
        !isFinite(seconds) ||
        seconds < 0
    ) {

        return "00:00";

    }


    const minutes =
        Math.floor(seconds / 60);


    const secs =
        Math.floor(seconds % 60);


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}

let externalTime = null;

async function getExternalTime() {

    try {

        const response = await fetch(
            "https://timeapi.io/api/Time/current/zone?timeZone=Europe%2FIstanbul"
        );

        const data = await response.json();

        externalTime = new Date(data.dateTime);

        updateDigitalClock();

        setInterval(function() {

            externalTime.setSeconds(
                externalTime.getSeconds() + 1
            );

            updateDigitalClock();

        }, 1000);

    }

    catch (error) {

        document.getElementById(
            "digitalClock"
        ).textContent = "--:--:--";

    }

    if (!externalTime) {
        return;
    }

    const hours =
        String(externalTime.getHours()).padStart(2, "0");

    const minutes =
        String(externalTime.getMinutes()).padStart(2, "0");

    const seconds =
        String(externalTime.getSeconds()).padStart(2, "0");

    document.getElementById(
        "digitalClock"
    ).textContent =
        hours + ":" +
        minutes + ":" +
        seconds;

async function getWeather() {

    try {

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=40.1667&longitude=29.0833&current=temperature_2m,weather_code&timezone=Europe%2FIstanbul"
        );

        const data = await response.json();

        const temperature =
            Math.round(data.current.temperature_2m);

        const code =
            data.current.weather_code;

        let icon = "🌤️";

        if (code === 0) {
            icon = "☀️";
        }
        else if (code <= 3) {
            icon = "🌤️";
        }
        else if (code <= 48) {
            icon = "🌫️";
        }
        else if (code <= 67) {
            icon = "🌧️";
        }
        else if (code <= 77) {
            icon = "❄️";
        }
        else if (code <= 82) {
            icon = "🌦️";
        }
        else if (code <= 99) {
            icon = "⛈️";
        }

        document.getElementById(
            "weather"
        ).textContent =
            icon + " " +
            temperature + "°C";

    }

    catch (error) {

        document.getElementById(
            "weather"
        ).textContent =
            "🌡️ --°C";

    }

}

let RADIO_BROWSER_API = null;

const RADIO_BROWSER_DISCOVERY =
    "https://all.api.radio-browser.info/json/servers";


async function findRadioBrowserServer() {

    try {

        const response = await fetch(
            RADIO_BROWSER_DISCOVERY,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Sunucu listesi alınamadı");
        }

        const servers = await response.json();

        if (!servers || !servers.length) {
            throw new Error("Sunucu bulunamadı");
        }

        /*
         * İlk erişilebilir sunucuyu bul.
         */

        for (const server of servers) {

            if (!server.name) {
                continue;
            }

            const protocol = "https://";

            const serverURL =
                protocol + server.name;

            try {

                const testResponse =
                    await fetch(
                        serverURL + "/json/stations?limit=1",
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );

                if (testResponse.ok) {

                    RADIO_BROWSER_API =
                        serverURL;

                    console.log(
                        "Radio Browser sunucusu:",
                        RADIO_BROWSER_API
                    );

                    return true;
                }

            } catch (error) {

                console.log(
                    "Sunucu çalışmadı:",
                    serverURL
                );

            }

        }

    } catch (error) {

        console.error(
            "Radio Browser sunucu keşfi:",
            error
        );

    }

    return false;
}

        const countries = await response.json();

            if (!country.iso_3166_1) {

        select.innerHTML =
            '<option value="">Ülkeler alınamadı</option>';

    }


    /* ========================================
       KÜTÜPHANE
    ======================================== */

    refreshLibraryLanguage();

}


/* ========================================
   TR
======================================== */

if (trButton) {

    trButton.onclick = function() {

        currentLanguage = "tr";

        localStorage.setItem(
            "enisLanguage",
            "tr"
        );

        applyLanguage();

    };

}


/* ========================================
   EN
======================================== */

if (enButton) {

    enButton.onclick = function() {

        currentLanguage = "en";

        localStorage.setItem(
            "enisLanguage",
            "en"
        );

        applyLanguage();

    };

}


/* ========================================
   SAYFA AÇILIŞI
======================================== */

applyLanguage();


</script>
